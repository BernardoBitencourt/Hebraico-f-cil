<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - Hebraico Fácil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="logo">Hebraico Fácil 🇮🇱</div>

    <button class="botao-menu" onclick="abrirMenu()" aria-label="Abrir menu">
        ☰
    </button>
</header>

<nav id="menu-lateral" class="menu-lateral">
    <button class="fechar-menu" onclick="fecharMenu()" aria-label="Fechar menu">×</button>

    <h2>MENU</h2>

    <a href="index.html">Início</a>
    <a href="sala.html">Sala de Aula</a>
    <a href="cadastro.html">Cadastro / Login</a>
    <a href="perfil.html">Perfil</a>
</nav>

<div id="fundo-menu" class="fundo-menu" onclick="fecharMenu()"></div>

<main class="container">
    <div class="profile">
        <h1>Meu Perfil</h1>
        <p><strong>Nome:</strong> <span id="nomePerfil">Visitante</span></p>
        <p><strong>E-mail:</strong> <span id="emailPerfil">Não cadastrado</span></p>
        <p><strong>Progresso:</strong> Começando os estudos.</p>
        <a class="botao" href="sala.html">Continuar aula</a>
    </div>
</main>

<script>
// Mostra os dados salvos no cadastro.
const usuario = JSON.parse(localStorage.getItem("usuario"));
if (usuario) {
    document.getElementById("nomePerfil").textContent = usuario.nome;
    document.getElementById("emailPerfil").textContent = usuario.email;
}
</script>
<script>
function abrirMenu() {
    document.getElementById("menu-lateral").classList.add("aberto");
    document.getElementById("fundo-menu").classList.add("aberto");
}

function fecharMenu() {
    document.getElementById("menu-lateral").classList.remove("aberto");
    document.getElementById("fundo-menu").classList.remove("aberto");
}
</script>
</body>
</html>
